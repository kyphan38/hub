<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kyphan38</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    color: #111;
    font-family: 'Geist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .page {
    max-width: 580px;
    margin: 0 auto;
    padding: 0 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .hero {
    padding: 72px 0 52px;
  }

  h1 {
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #111;
  }

  .tools {
    flex: 1;
    list-style: none;
  }

  .tool-row {
    display: flex;
    align-items: center;
    padding: 18px 0;
    border-top: 1px solid #ebebeb;
    text-decoration: none;
    color: inherit;
    gap: 12px;
  }

  .tool-row:last-child {
    border-bottom: 1px solid #ebebeb;
  }

  .tool-name {
    font-size: 15px;
    font-weight: 500;
    color: #111;
    width: 52px;
    flex-shrink: 0;
  }

  .tool-url {
    font-size: 13px;
    font-weight: 300;
    color: #aaa;
    flex: 1;
  }

  .tool-arrow {
    color: #ccc;
    font-size: 15px;
    transition: color 0.15s, transform 0.15s;
  }

  .tool-row:hover .tool-arrow {
    color: #888;
    transform: translateX(2px);
  }

  footer {
    padding: 36px 0 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-text {
    font-size: 12px;
    font-weight: 300;
    color: #ccc;
  }

  .footer-link {
    font-size: 12px;
    font-weight: 300;
    color: #ccc;
    text-decoration: none;
  }

  .footer-link:hover { color: #888; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <h1>Personal<br>workspace</h1>
  </div>

  <ul class="tools">
    <li>
      <a class="tool-row" href="https://mesi.kyphan38.com" target="_blank" rel="noopener">
        <span class="tool-name">Mesi</span>
        <span class="tool-url">mesi.kyphan38.com</span>
        <span class="tool-arrow">→</span>
      </a>
    </li>
    <li>
      <a class="tool-row" href="https://noda.kyphan38.com" target="_blank" rel="noopener">
        <span class="tool-name">Noda</span>
        <span class="tool-url">noda.kyphan38.com</span>
        <span class="tool-arrow">→</span>
      </a>
    </li>
    <li>
      <a class="tool-row" href="https://cogi.kyphan38.com" target="_blank" rel="noopener">
        <span class="tool-name">Cogi</span>
        <span class="tool-url">cogi.kyphan38.com</span>
        <span class="tool-arrow">→</span>
      </a>
    </li>
    <li>
      <a class="tool-row" href="https://arca.kyphan38.com" target="_blank" rel="noopener">
        <span class="tool-name">Arca</span>
        <span class="tool-url">arca.kyphan38.com</span>
        <span class="tool-arrow">→</span>
      </a>
    </li>
  </ul>

  <footer>
    <span class="footer-text">kyphan38 · built for one</span>
    <a class="footer-link" href="https://github.com/kyphan38" target="_blank" rel="noopener">github</a>
  </footer>

</div>
</body>
</html>
